# Reverse proxy / load balancer in front of the calculator replicas.

# Docker's embedded DNS. With "resolve" below, nginx re-queries it so the upstream
# tracks replica IPs across redeploys (a plain upstream would keep stale IPs -> 502).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream calculator {
    zone calculator 64k;
    server calculator:8080 resolve;   # round-robin across every replica IP
}

server {
    listen 80;

    # Shows which replica served the request (useful for demonstrating load-balancing)
    add_header X-Upstream $upstream_addr always;

    location /api/ {
        proxy_pass http://calculator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location = /actuator/health {
        proxy_pass http://calculator;
    }

    # Liveness of the proxy itself
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
    }

    location / {
        default_type application/json;
        return 404 '{"error":"Not Found"}';
    }
}
